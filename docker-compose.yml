services:
  ray-head:
    image: rayproject/ray:2.56.1
    container_name: ray-head
    hostname: ray-head
    command:
      - bash
      - -c
      - >
        ray start
        --head
        --port=6379
        --dashboard-host=0.0.0.0
        --dashboard-port=8265
        --num-cpus=0
        --block
    ports:
      - "127.0.0.1:8265:8265"
    volumes:
      - ./app:/app
    shm_size: "1gb"
    networks:
      - ray-network

  ray-worker-1:
    image: rayproject/ray:2.56.1
    container_name: ray-worker-1
    hostname: ray-worker-1
    command:
      - bash
      - -c
      - >
        sleep 5 &&
        ray start
        --address=ray-head:6379
        --num-cpus=1
        --block
    depends_on:
      - ray-head
    restart: on-failure
    shm_size: "1gb"
    networks:
      - ray-network

  ray-worker-2:
    image: rayproject/ray:2.56.1
    container_name: ray-worker-2
    hostname: ray-worker-2
    command:
      - bash
      - -c
      - >
        sleep 5 &&
        ray start
        --address=ray-head:6379
        --num-cpus=1
        --block
    depends_on:
      - ray-head
    restart: on-failure
    shm_size: "1gb"
    networks:
      - ray-network

networks:
  ray-network:
    driver: bridge
